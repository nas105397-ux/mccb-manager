<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" fill="#f8fafc"/><rect x="50" y="40" width="360" height="540" rx="18" fill="#fff" stroke="#d1d5db"/><text x="80" y="85" font-size="18" font-family="sans-serif" font-weight="800" fill="#374151">📝 停電依頼書の作成・印刷用フォーム</text><line x1="80" y1="105" x2="380" y2="105" stroke="#e5e7eb"/><text x="80" y="145" font-size="14" font-family="sans-serif" font-weight="700" fill="#64748b">作業責任者名 *</text><rect x="80" y="158" width="300" height="44" rx="6" fill="#f9fafb" stroke="#cbd5e1"/><text x="96" y="187" font-size="14" font-family="sans-serif" fill="#94a3b8">例: 山田 太郎</text><text x="80" y="238" font-size="14" font-family="sans-serif" font-weight="700" fill="#64748b">作業内容・目的 *</text><rect x="80" y="251" width="300" height="44" rx="6" fill="#f9fafb" stroke="#cbd5e1"/><text x="96" y="280" font-size="14" font-family="sans-serif" fill="#94a3b8">例: ○○ポンプ定期点検作業</text><rect x="470" y="40" width="480" height="540" rx="18" fill="#fff" stroke="#d1d5db"/><text x="500" y="85" font-size="20" font-family="sans-serif" font-weight="800" fill="#1f2937">停電依頼書プレビュー</text><rect x="500" y="125" width="420" height="70" rx="8" fill="#f8fafc" stroke="#e5e7eb"/><text x="525" y="154" font-size="15" font-family="sans-serif" fill="#334155">作業責任者名・作業内容を入力すると</text><text x="525" y="178" font-size="15" font-family="sans-serif" fill="#334155">右側の依頼表に反映されます。</text></svg>
